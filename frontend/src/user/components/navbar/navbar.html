<nav class="main-nav">
  <div class="nav-logo">
    <a routerLink="/">AESTHETIC</a>
  </div>

  <button class="nav-toggle" (click)="toggleNav()" [class.nav--open]="isNavOpen" aria-label="Toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <ul class="nav-links" [class.nav-links--open]="isNavOpen">
    <li><a routerLink="/shop" routerLinkActive="active" (click)="closeNav()">Shop</a></li>
    <li><a routerLink="/new-arrivals" routerLinkActive="active" (click)="closeNav()">New Arrivals</a></li>
    <li><a routerLink="/about" routerLinkActive="active" (click)="closeNav()">About</a></li>
    @if (!userState) {
      <li class="mobile-only"><a routerLink="/login" class="nav-button" (click)="closeNav()">Sign In</a></li>
      <li class="mobile-only"><a routerLink="/signup" class="nav-button" (click)="closeNav()">Sign Up</a></li>
    }
  </ul>

  <div class="nav-actions">
    <a routerLink="/cart" class="nav-icon" aria-label="Shopping Cart">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-cart"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </a>
  
    @if (userState) { 
    <div class="user-menu">
      <button class="user-menu-trigger" (click)="toggleDropdown()">
        <span>Hi, {{ userState.username }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      @if (isDropdownOpen) {
      <div class="user-dropdown">
        <a routerLink="/account" (click)="toggleDropdown()">My Account</a>
        <a (click)="logout()">Logout</a>
      </div>
      }
    </div>
    } @else {  
    <a routerLink="/login" class="nav-button desktop-only">Sign In</a>
    <a routerLink="/signup" class="nav-button desktop-only">Sign Up</a>
    }
  </div>
</nav>
<div class="nav-overlay" [class.nav-overlay--open]="isNavOpen" (click)="closeNav()"></div>
