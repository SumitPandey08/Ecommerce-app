<div class="otp-container">
  <div class="otp-card">
    <div class="otp-header">
      <h2>OTP Verification</h2>
      <p>Enter the OTP sent to your email</p>
    </div>
    <form (ngSubmit)="onSubmit()" #otpForm="ngForm">
      <div class="form-group">
        <label for="otp">OTP</label>
        <input type="text" [(ngModel)]="otpData.otp" id="otp" name="otp" required minlength="6" maxlength="6" [disabled]="loading" />
      </div>
      <div class="form-footer">
        <button type="submit" class="btn" [disabled]="!otpForm.form.valid || loading">Verify OTP</button>
      </div>
      <a (click)="onResendOTP()" class="resend-otp-link" [class.disabled]="loading">Resend OTP</a>
      @if(message) {<div  class="message">{{ message }}</div>}
    </form>
  </div>
</div>
